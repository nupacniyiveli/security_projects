name: Terraform Network Guard tests
on:
  push:
    paths:
      - 'terraform-network-guard/**'
      - '.github/workflows/terraform-network-guard.yml'
  pull_request:
    paths:
      - 'terraform-network-guard/**'
      - '.github/workflows/terraform-network-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-network-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python network_guard.py examples/safe.json
      - name: Verify unsafe example fails the gate
        run: |
          set +e
          python network_guard.py examples/unsafe.json
          status=$?
          test "$status" -eq 1
